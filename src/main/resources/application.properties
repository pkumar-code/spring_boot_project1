server.port=5555

#DataSource

spring.datasource.driver-class-name=com.mysql.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/otpdb
#spring.datasource.username=root
#spring.datasource.password=kumar123

spring.datasource.url=jdbc:mysql://${JLC_MYSQL_HOST}:${JLC_MYSQL_PORT}/${JLC_MYSQL_DATABASE}
spring.datasource.username=${JLC_MYSQL_USER}
spring.datasource.password=${JLC_MYSQL_PASSWORD}

#hikardatsource
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.connection-timeout=200000

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#Logger
logging.level.root=info
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
#logging.pattern.console=% -5%level %logger{36} -%m -%n
